name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $m = Select-String -Path src/App.cs -Pattern 'const string Version = "([^"]+)"'
          $ver = $m.Matches[0].Groups[1].Value
          if ($ver -ne $tag) {
            Write-Error "标签 v$tag 和 src/App.cs 里的 Version ($ver) 不一致，请先改版本号再打标签"
            exit 1
          }

      - name: Build
        shell: cmd
        run: '"%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /codepage:65001 /optimize /warn:4 /warnaserror /target:winexe /win32manifest:src\app.manifest /win32icon:src\app.ico /out:DisplayKit.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Device.dll src\*.cs'

      - uses: actions/upload-artifact@v4
        with:
          name: DisplayKit
          path: DisplayKit.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DisplayKit.exe
          generate_release_notes: true
          body: |
            下载 `DisplayKit.exe` 直接运行即可，单文件、无需安装（Windows 10/11 自带所需的 .NET Framework 4.8）。

            首次运行时 Windows SmartScreen 可能提示"已保护你的电脑"，因为程序没有数字签名：点"更多信息" → "仍要运行"。

            建议把 exe 放到固定位置（如 `%LOCALAPPDATA%\Programs\DisplayKit\`）再打开"开机自启动"。
